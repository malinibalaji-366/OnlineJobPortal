
{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 650px;">

        <h2 class="text-center mb-4">Edit My Profile</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" name="phone"
                       class="form-control"
                       value="{{ profile.phone }}" required>
            </div>

            <div class="mb-3">
                <label>Education</label>
                <input type="text" name="education"
                       class="form-control"
                       value="{{ profile.education }}" required>
            </div>

            <div class="mb-3">
                <label>Skills</label>
                <textarea name="skills" class="form-control"
                          rows="4" required>{{ profile.skills }}</textarea>
            </div>

            <div class="mb-3">
                <label>Location</label>
                <input type="text" name="location"
                       class="form-control"
                       value="{{ profile.location }}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Save Changes
            </button>

            <a href="{% url 'candidate_profile' %}"
               class="btn btn-secondary w-100 mt-2">
                Cancel
            </a>

        </form>
    </div>
</div>

{% endblock %}
