
{% extends 'base.html' %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 750px;">

        <h2 class="text-center mb-4">Post a New Job</h2>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text" name="title"
                       class="form-control"
                       placeholder="Example: Python Developer"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Requirements</label>
                <textarea name="requirements"
                          class="form-control"
                          rows="4"
                          required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location"
                       class="form-control"
                       placeholder="Chennai"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="text" name="salary"
                       class="form-control"
                       placeholder="2.5 - 3 LPA"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Type</label>
                <select name="job_type" class="form-select" required>
                    <option value="">Select Job Type</option>
                    <option value="Full Time">Full Time</option>
                    <option value="Part Time">Part Time</option>
                    <option value="Internship">Internship</option>
                    <option value="Remote">Remote</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Number of Vacancies</label>
                <input type="number" name="vacancies"
                       class="form-control"
                       min="1"
                       value="1"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Publish Job
            </button>

            <a href="{% url 'company_dashboard' %}"
               class="btn btn-outline-secondary w-100 mt-2">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
