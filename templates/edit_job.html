
{% extends 'base.html' %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 750px;">

        <h2 class="text-center mb-4">Edit Job</h2>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text" name="title"
                       class="form-control"
                       value="{{ job.title }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4" required>{{ job.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Requirements</label>
                <textarea name="requirements"
                          class="form-control"
                          rows="4" required>{{ job.requirements }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location"
                       class="form-control"
                       value="{{ job.location }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="text" name="salary"
                       class="form-control"
                       value="{{ job.salary }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Type</label>
                <select name="job_type" class="form-select" required>
                    <option value="Full Time"
                        {% if job.job_type == 'Full Time' %}selected{% endif %}>
                        Full Time
                    </option>

                    <option value="Part Time"
                        {% if job.job_type == 'Part Time' %}selected{% endif %}>
                        Part Time
                    </option>

                    <option value="Internship"
                        {% if job.job_type == 'Internship' %}selected{% endif %}>
                        Internship
                    </option>

                    <option value="Remote"
                        {% if job.job_type == 'Remote' %}selected{% endif %}>
                        Remote
                    </option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Vacancies</label>
                <input type="number" name="vacancies"
                       class="form-control"
                       min="1"
                       value="{{ job.vacancies }}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Save Changes
            </button>

            <a href="{% url 'manage_jobs' %}"
               class="btn btn-outline-secondary w-100 mt-2">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
